name: CI

on:
  push:
  pull_request:

jobs:
  standard-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl g++ gfortran make openmpi-bin libopenmpi-dev

      - name: Install fpm
        env:
          FPM_VERSION: "0.11.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/fortran-lang/fpm/releases/download/v${FPM_VERSION}/fpm-${FPM_VERSION}-linux-x86_64-gcc-12" \
            -o "$HOME/.local/bin/fpm"
          chmod +x "$HOME/.local/bin/fpm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/fpm" --version

      - name: Run standard test gate
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          MPIRUN_FLAGS: "--oversubscribe"
        run: bash scripts/test.sh
